<svg xmlns="http://www.w3.org/2000/svg" width="900" height="412" viewBox="0 0 900 412" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace">
<style>
  .l { opacity: 0; animation: show .01s linear forwards; }
  @keyframes show { to { opacity: 1; } }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  
  .drain { animation: drain 7s ease-in-out infinite; transform-box: fill-box; transform-origin: left; }
  @keyframes drain { 0%,8% { transform: scaleX(1); } 80% { transform: scaleX(.12); } 92%,100% { transform: scaleX(1); } }
  .wobble { animation: wobble 3s ease-in-out infinite; transform-box: fill-box; transform-origin: left; }
  @keyframes wobble { 0%,100% { transform: scaleX(.78); } 50% { transform: scaleX(.97); } }
  .fill { animation: fill 9s linear infinite; transform-box: fill-box; transform-origin: left; }
  @keyframes fill { 0% { transform: scaleX(.05); } 90% { transform: scaleX(.92); } 100% { transform: scaleX(.92); } }
  .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

</style>
